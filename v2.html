<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竜夜家故事存檔 V2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10121a;color:#f4f4f7;font:16px system-ui}header{background:#202437;padding:20px}main{max-width:760px;margin:auto;padding:16px}section{background:#1b2030;border:1px solid #343a4d;border-radius:14px;padding:16px;margin-bottom:16px}input,select,textarea{width:100%;font:inherit;color:white;background:#101521;border:1px solid #515a70;border-radius:9px;padding:12px}textarea{min-height:230px;line-height:1.6}label{display:block;margin:12px 0 6px;font-weight:650}button{border:0;border-radius:9px;padding:12px;background:#637ff3;color:white;font:inherit;font-weight:650;margin:5px 5px 5px 0}.secondary{background:#394459}.danger{background:#8d4050}.entry{border-top:1px solid #42485c;padding:12px 0}.muted{color:#aeb7cc;font-size:13px}#status{white-space:pre-wrap;color:#9ee3b0}</style></head><body><header><h1>📚 竜夜家故事存檔管理器 V2</h1><p>手機版・完整正文・防覆蓋</p></header><main><section><h2>📋 快速匯入</h2><p class="muted">支援格式：第一行「部隊：第一部隊」、第二行「角色：竜夜 棺音」、第三行「標題：破碎的黑棺」、第四行「正文：」，之後貼上完整故事。也可直接貼純正文，再手動填寫欄位。</p><textarea id="quick" placeholder="部隊：第一部隊&#10;角色：竜夜 棺音&#10;標題：破碎的黑棺&#10;正文：&#10;故事全文……"></textarea><button onclick="parseQuick()">辨識並填入</button></section><section><h2>新增故事</h2><label>部隊</label><select id="unit"></select><label>角色正式姓名</label><input id="person" placeholder="竜夜 棺音"><button class="secondary" onclick="nextOrder()">自動下一篇編號</button><label>篇章順序</label><input id="order" type="number" min="1" value="1"><label>篇章標題</label><input id="title"><label>完整故事正文</label><textarea id="body"></textarea><button onclick="saveStory()">💾 儲存並備份</button><button class="secondary" onclick="resetForm()">清空編輯區</button><p id="status" role="status"></p></section><section><h2>故事列表</h2><label>篩選部隊</label><select id="filter" onchange="render()"></select><div id="entries"></div></section><section><h2>備份與匯出</h2><button onclick="exportJSON()">匯出完整 JSON</button><button onclick="exportTXT()">匯出目前部隊 TXT</button><label>匯入 JSON 備份</label><input type="file" id="importfile" accept=".json,application/json" onchange="importJSON(event)"><p class="muted">資料儲存在目前瀏覽器。請定期下載 JSON，清除網站資料可能遺失。此網頁不會自動將故事上傳 GitHub 或 ChatGPT。</p></section></main><script>
const KEY='ryuya_stories_v1',UNITS=Array.from({length:9},(_,i)=>`第${'一二三四五六七八九'[i]}部隊`);let stories=[],editing=null;const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');stories=Array.isArray(v)?v:[]}catch(e){alert('讀取資料失敗，請保留原有資料並檢查備份')}}
function persist(){localStorage.setItem(KEY,JSON.stringify(stories))}
function init(){UNITS.forEach(u=>{$('unit').add(new Option(u,u));$('filter').add(new Option(u,u))});$('filter').add(new Option('全部部隊','all'),0);$('filter').value='all';load();render()}
function nextOrder(){const u=$('unit').value,p=$('person').value.trim();if(!p){alert('請先填寫角色姓名');return}const nums=stories.filter(s=>s.unit===u&&s.person===p).map(s=>Number(s.order)||0);$('order').value=Math.max(0,...nums)+1}
function parseQuick(){const t=$('quick').value.replace(/\r\n/g,'\n');const m=t.match(/^部隊[：:]\s*(.+)\n角色[：:]\s*(.+)\n標題[：:]\s*(.+)\n正文[：:]\s*\n?([\s\S]*)$/);if(m){if(!UNITS.includes(m[1].trim())){alert('部隊名稱無法辨識');return}$('unit').value=m[1].trim();$('person').value=m[2].trim();$('title').value=m[3].trim();$('body').value=m[4];nextOrder();$('status').textContent='已填入資料，請檢查完整正文後按儲存'}else{$('body').value=t;$('status').textContent='已貼入純正文，請手動填寫部隊、角色、標題與篇章順序'}window.scrollTo(0,$('person').getBoundingClientRect().top+window.scrollY-90)}
function resetForm(){editing=null;['person','title','body','quick'].forEach(id=>$(id).value='');$('order').value=1;$('status').textContent=''}
function saveStory(){const unit=$('unit').value,person=$('person').value.trim(),order=Number($('order').value),title=$('title').value.trim(),body=$('body').value;if(!person||!title||!body.trim()||!Number.isInteger(order)||order<1){alert('請填寫所有必要欄位');return}const conflict=stories.find(s=>s.unit===unit&&s.person===person&&Number(s.order)===order&&s.id!==editing);if(conflict){alert(`這個角色的第 ${order} 篇已存在：「${conflict.title}」。請更換篇章編號，以免重複。`);return}const old=stories.find(s=>s.id===editing);if(old&&!confirm('即將更新原篇章，舊正文會保留為歷史版本。確定？'))return;const history=old?[...(old.history||[]),{body:old.body,title:old.title,order:old.order,updatedAt:old.updatedAt}]:[];const id=editing||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());const entry={id,unit,person,order,title,body,history,updatedAt:new Date().toISOString()};const index=stories.findIndex(s=>s.id===id);if(index<0)stories.push(entry);else stories[index]=entry;try{persist();editing=id;$('status').textContent=`✅ 已儲存：${unit}／${person}／${title}，正文 ${body.length} 字元，舊版 ${history.length} 份`;render()}catch(e){alert('儲存失敗：'+e.message)}}
function render(){const root=$('entries');root.replaceChildren();const selected=$('filter').value;const data=stories.filter(s=>selected==='all'||s.unit===selected).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||a.person.localeCompare(b.person,'zh-Hant')||Number(a.order)-Number(b.order));if(!data.length){root.textContent='尚無故事';return}for(const s of data){const div=document.createElement('div');div.className='entry';const strong=document.createElement('strong');strong.textContent=`${s.unit}｜${s.person}｜${s.order}. ${s.title}`;const info=document.createElement('p');info.className='muted';info.textContent=`${s.body.length} 字元・舊版 ${(s.history||[]).length} 份`;div.append(strong,info);function btn(name,fn,cls=''){const b=document.createElement('button');b.textContent=name;b.className=cls;b.onclick=fn;div.append(b)}btn('編輯',()=>{editing=s.id;$('unit').value=s.unit;$('person').value=s.person;$('order').value=s.order;$('title').value=s.title;$('body').value=s.body;window.scrollTo(0,0)});btn('下載 TXT',()=>downloadFile(`${s.person}_${s.order}_${s.title}.txt`,formatStory(s),'text/plain;charset=utf-8'),'secondary');btn('刪除',()=>{if(confirm(`確定刪除「${s.title}」及其歷史版本？`)){stories=stories.filter(x=>x.id!==s.id);persist();render()}},'danger');if((s.history||[]).length){const d=document.createElement('details');const summary=document.createElement('summary');summary.textContent='歷史版本';d.append(summary);s.history.forEach((h,i)=>{const b=document.createElement('button');b.className='secondary';b.textContent=`下載舊版 ${i+1}`;b.onclick=()=>downloadFile(`${s.person}_舊版${i+1}.txt`,h.body,'text/plain;charset=utf-8');d.append(b)});div.append(d)}root.append(div)}}
function formatStory(s){return `${s.unit}\n${s.person}\n第 ${s.order} 篇：${s.title}\n\n${s.body}\n\n`}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){downloadFile('竜夜家_完整故事備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'ryuya-v1',exportedAt:new Date().toISOString(),stories},null,2),'application/json')}
function exportTXT(){const u=$('filter').value;if(u==='all'){alert('請先選擇單一部隊');return}const data=stories.filter(s=>s.unit===u).sort((a,b)=>a.person.localeCompare(b.person,'zh-Hant')||Number(a.order)-Number(b.order));if(!data.length){alert('此部隊尚無故事');return}downloadFile(u+'_完整故事.txt',data.map(formatStory).join('\n'+'='.repeat(35)+'\n\n'),'text/plain;charset=utf-8')}
async function importJSON(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='ryuya-v1'||!Array.isArray(obj.stories))throw Error('備份格式不正確');if(!confirm(`匯入 ${obj.stories.length} 篇故事？相同 ID 會覆蓋現有資料，請先匯出目前備份。`))return;const map=new Map(stories.map(s=>[s.id,s]));for(const s of obj.stories){if(typeof s.id!=='string'||!UNITS.includes(s.unit)||typeof s.person!=='string'||typeof s.title!=='string'||typeof s.body!=='string')throw Error('故事格式不正確');map.set(s.id,s)}stories=[...map.values()];persist();render();alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}}init();
</script></body></html>
