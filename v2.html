<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竜夜家故事存檔管理器 V2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10121a;color:#f4f4f7;font:16px system-ui,sans-serif}header{padding:20px 16px;background:#202437}h1{font-size:23px;margin:0 0 8px}main{max-width:760px;margin:auto;padding:16px}section{background:#1b2030;border:1px solid #343a4d;border-radius:14px;padding:16px;margin:0 0 16px}label{display:block;margin:12px 0 6px;font-weight:650}input,select,textarea{width:100%;font:inherit;color:white;background:#101521;border:1px solid #515a70;border-radius:9px;padding:12px}textarea{min-height:190px;resize:vertical;line-height:1.6}button{border:0;border-radius:9px;padding:12px 14px;background:#637ff3;color:white;font:inherit;font-weight:650;margin:6px 6px 6px 0}button.secondary{background:#394459}button.danger{background:#8d4050}.entry{border-top:1px solid #42485c;padding:12px 0}.muted{color:#aeb7cc;font-size:13px}#status{white-space:pre-wrap;color:#9ee3b0}details{margin-top:12px}summary{cursor:pointer}
</style>
</head>
<body>
<header><h1>📚 竜夜家故事存檔管理器 V2</h1><div>手機版・九大部隊・快速貼上・完整備份</div></header>
<main>
<section><h2>快速貼上</h2><p class="muted">支援依序貼入「部隊、角色、篇章（可省略）、標題、正文」。</p><textarea id="quick" placeholder="部隊：第一部隊&#10;角色：竜夜 棺音&#10;篇章：2&#10;標題：故事名稱&#10;正文：&#10;完整故事內容"></textarea><button onclick="parseQuick()">📋 自動辨識並填入</button></section>
<section><h2>新增／更新故事</h2><label>部隊</label><select id="unit" onchange="nextOrder()"></select><label>角色正式姓名</label><input id="person" placeholder="例如：竜夜 棺音" oninput="nextOrder()"><button class="secondary" onclick="nextOrder()">自動下一篇編號</button><label>篇章順序</label><input id="order" type="number" min="1" value="1"><label>篇章標題</label><input id="title"><label>完整故事正文</label><textarea id="body"></textarea><button onclick="saveStory()">💾 儲存並備份</button><button class="secondary" onclick="resetForm()">清空編輯區</button><p id="status" role="status"></p></section>
<section><h2>故事列表</h2><label>篩選部隊</label><select id="filter" onchange="render()"></select><div id="entries"></div></section>
<section><h2>備份與匯出</h2><button onclick="exportJSON()">匯出完整 JSON 備份</button><button onclick="exportTXT()">匯出目前部隊 TXT</button><label>匯入 JSON 備份</label><input type="file" id="importfile" accept=".json,application/json" onchange="importJSON(event)"><p class="muted">⚠️ 資料儲存在目前瀏覽器；請定期下載 JSON 備份。GitHub Pages 不會自動同步故事到 GitHub。</p></section>
</main>
<script>
const KEY='ryuya_stories_v1';
const UNITS=Array.from({length:9},(_,i)=>`第${'一二三四五六七八九'[i]}部隊`);
const $=id=>document.getElementById(id);
let stories=[],editing=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');stories=Array.isArray(v)?v:[]}catch(e){alert('讀取舊存檔失敗，請勿清除瀏覽器資料')}}
function persist(){localStorage.setItem(KEY,JSON.stringify(stories))}
function init(){UNITS.forEach(u=>{$('unit').add(new Option(u,u));$('filter').add(new Option(u,u))});$('filter').add(new Option('全部部隊','all'),0);$('filter').value='all';load();render()}
function nextOrder(){if(editing)return;const u=$('unit').value,p=$('person').value.trim();const nums=stories.filter(s=>s.unit===u&&s.person===p).map(s=>Number(s.order)||0);$('order').value=Math.max(0,...nums)+1}
function parseQuick(){
 const t=$('quick').value.replace(/\r\n?/g,'\n').trimStart();
 const m=t.match(/^部隊[：:][ \t]*(.+)\n角色[：:][ \t]*(.+)\n(?:篇章[：:][ \t]*(\d+)[ \t]*\n)?標題[：:][ \t]*(.+)\n正文[：:][ \t]*\n?([\s\S]*)$/);
 if(m){
  const u=m[1].trim();if(!UNITS.includes(u)){alert('部隊名稱無法辨識');return}
  editing=null;$('unit').value=u;$('person').value=m[2].trim();$('title').value=m[4].trim();$('body').value=m[5];
  if(m[3])$('order').value=Number(m[3]);else nextOrder();
  $('status').textContent='✅ 已辨識部隊、角色、篇章、標題及正文，請檢查後儲存';
 }else{$('body').value=t;$('status').textContent='⚠️ 未能辨識格式，已貼入純正文，請手動填寫欄位'}
 $('person').scrollIntoView({behavior:'smooth',block:'start'});
}
function resetForm(){editing=null;['person','title','body','quick'].forEach(id=>$(id).value='');$('order').value=1;$('status').textContent=''}
function saveStory(){const unit=$('unit').value,person=$('person').value.trim(),order=Number($('order').value),title=$('title').value.trim(),body=$('body').value;if(!person||!title||!body.trim()||!Number.isInteger(order)||order<1){alert('請填寫角色、篇章順序、標題與完整正文');return}const duplicate=stories.find(s=>s.unit===unit&&s.person===person&&Number(s.order)===order&&s.id!==editing);if(duplicate&&!confirm(`這個角色的第 ${order} 篇已存在：「${duplicate.title}」。仍要另存一篇相同編號的故事嗎？`))return;const id=editing||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());const idx=stories.findIndex(s=>s.id===id),old=idx>=0?stories[idx]:null;if(old&&!confirm(`確定更新「${old.title}」嗎？原本正文將保留在歷史版本中。`))return;const history=old?[...(old.history||[]),{body:old.body,updatedAt:old.updatedAt,title:old.title,order:old.order}]:[];const entry={id,unit,person,order,title,body,history,updatedAt:new Date().toISOString()};if(idx>=0)stories[idx]=entry;else stories.push(entry);try{persist();editing=id;$('status').textContent=`✅ 已儲存：${unit}／${person}／${title}\n正文 ${body.length} 字元，歷史版本 ${history.length} 份。請定期匯出 JSON。`;render()}catch(e){alert('儲存失敗，可能是瀏覽器空間不足：'+e.message)}}
function render(){const root=$('entries');root.replaceChildren();const u=$('filter').value;const data=stories.filter(s=>u==='all'||s.unit===u).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||a.person.localeCompare(b.person,'zh-Hant')||Number(a.order)-Number(b.order));if(!data.length){root.textContent='尚無故事';return}for(const s of data){const div=document.createElement('div');div.className='entry';const h=document.createElement('strong');h.textContent=`${s.unit}｜${s.person}｜${s.order}. ${s.title}`;const info=document.createElement('div');info.className='muted';info.textContent=`${s.body.length} 字元・舊版 ${(s.history||[]).length} 份`;const edit=document.createElement('button');edit.textContent='編輯';edit.onclick=()=>{editing=s.id;$('unit').value=s.unit;$('person').value=s.person;$('order').value=s.order;$('title').value=s.title;$('body').value=s.body;window.scrollTo(0,0)};const down=document.createElement('button');down.className='secondary';down.textContent='下載 TXT';down.onclick=()=>downloadFile(`${s.person}_${s.order}_${s.title}.txt`,formatStory(s),'text/plain;charset=utf-8');const del=document.createElement('button');del.className='danger';del.textContent='刪除';del.onclick=()=>{if(confirm(`確定刪除「${s.title}」及其歷史版本？請先匯出 JSON。`)){stories=stories.filter(x=>x.id!==s.id);persist();render()}};div.append(h,info,edit,down,del);if((s.history||[]).length){const d=document.createElement('details'),summary=document.createElement('summary');summary.textContent='歷史版本';d.append(summary);s.history.forEach((v,i)=>{const b=document.createElement('button');b.className='secondary';b.textContent=`下載舊版 ${i+1}`;b.onclick=()=>downloadFile(`${s.person}_${s.title}_舊版${i+1}.txt`,v.body,'text/plain;charset=utf-8');d.append(b)});div.append(d)}root.append(div)}}
function formatStory(s){return `${s.unit}\n${s.person}\n第 ${s.order} 篇：${s.title}\n\n${s.body}\n\n`}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_').slice(0,100);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){downloadFile('竜夜家_完整故事備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'ryuya-v1',exportedAt:new Date().toISOString(),stories},null,2),'application/json')}
function exportTXT(){const u=$('filter').value;if(u==='all'){alert('請先在故事列表選擇單一部隊');return}const data=stories.filter(s=>s.unit===u).sort((a,b)=>a.person.localeCompare(b.person,'zh-Hant')||Number(a.order)-Number(b.order));if(!data.length){alert('此部隊尚無故事');return}downloadFile(u+'_完整故事.txt',data.map(formatStory).join('\n'+'='.repeat(35)+'\n\n'),'text/plain;charset=utf-8')}
async function importJSON(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='ryuya-v1'||!Array.isArray(obj.stories))throw Error('不是有效的竜夜家備份格式');for(const s of obj.stories){if(typeof s.id!=='string'||!UNITS.includes(s.unit)||typeof s.body!=='string'||typeof s.person!=='string'||typeof s.title!=='string')throw Error('備份內容格式不正確')}if(!confirm(`將匯入 ${obj.stories.length} 篇故事；相同 ID 會以匯入版本取代，確定嗎？`))return;const map=new Map(stories.map(s=>[s.id,s]));obj.stories.forEach(s=>map.set(s.id,s));stories=[...map.values()];persist();render();alert(`匯入成功，目前共有 ${stories.length} 篇故事`)}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}}
init();
</script>
</body>
</html>
